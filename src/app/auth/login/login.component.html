<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4 relative overflow-hidden">
  <!-- Elementos decorativos flotantes -->
  <div class="absolute top-10 left-10 w-20 h-20 bg-white opacity-10 rounded-full animate-pulse"></div>
  <div class="absolute bottom-20 right-20 w-32 h-32 bg-white opacity-5 rounded-full animate-bounce" style="animation-duration: 3s;"></div>
  <div class="absolute top-1/2 left-5 w-16 h-16 bg-white opacity-10 rounded-full animate-pulse" style="animation-delay: 1s;"></div>

  <div class="glass-effect rounded-3xl p-8 w-full max-w-md shadow-2xl transform hover:scale-105 transition-all duration-300">
    <!-- Header con icono -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-r from-purple-400 to-pink-400 rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-bold text-white mb-2">¡Bienvenido a MediReminder!</h2>
      <p class="text-white/70 font-bold">Tu web para recordar tus dosis de medicina</p>
      <p class="text-white/70 text-sm">Inicia sesión para continuar tu experiencia</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">

      <!-- Campo Email -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-white/90">Correo electrónico</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
            </svg>
          </div>
          <input
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            [class]="getInputClasses('email')"
          />
        </div>
        <!-- Error message -->
        <div *ngIf="isFieldInvalid('email')" class="text-red-300 text-sm mt-1 animate-pulse">
          {{ getFieldError('email') }}
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-white/90">Contraseña</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            [class]="getInputClasses('password')"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center"
          >
            <svg class="h-5 w-5 text-white/40 hover:text-white/70 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <ng-container *ngIf="!showPassword; else eyeOffIcon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </ng-container>
              <ng-template #eyeOffIcon>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </ng-template>
            </svg>
          </button>
        </div>
        <!-- Error message -->
        <div *ngIf="isFieldInvalid('password')" class="text-red-300 text-sm mt-1 animate-pulse">
          {{ getFieldError('password') }}
        </div>
      </div>

      <!-- Checkbox recordarme y olvidar contraseña -->
      <div class="flex items-center justify-between">
        <label class="flex items-center">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="rounded border-white/20 bg-white/10 text-purple-400 focus:ring-purple-400 focus:ring-offset-0"
          >
          <span class="ml-2 text-sm text-white/70">Recordarme</span>
        </label>
        <a
          routerLink="/auth/forgot-password"
          class="text-sm text-purple-300 hover:text-purple-200 transition-colors"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Botón de login -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
        class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 px-4 rounded-xl font-semibold hover:from-purple-600 hover:to-pink-600 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-offset-2 focus:ring-offset-transparent transition-all duration-300 flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg hover:-translate-y-0.5"
      >
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading">Iniciando sesión...</span>
        <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </button>
    </form>

    <!-- Divisor -->
    <div class="flex items-center my-6">
      <div class="flex-grow h-px bg-white/20"></div>
      <span class="px-4 text-sm text-white/60">¿No tienes cuenta?</span>
      <div class="flex-grow h-px bg-white/20"></div>
    </div>

    <!-- Link de registro -->
    <div class="text-center">
      <a
        routerLink="/auth/register"
        class="inline-flex items-center space-x-2 text-white hover:text-purple-200 font-medium transition-colors duration-300 group"
      >
        <span>Crear cuenta nueva</span>
        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
        </svg>
      </a>
    </div>
  </div>
</div>
